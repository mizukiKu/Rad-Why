name: Kernel Build - Whyred

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc clang lld git \
            libncurses-dev libssl-dev zip lzop python3 python3-pip \
            rsync unzip wget

      - name: Clone WeebX Clang
        run: |
          git clone --depth=1 https://gitlab.com/XSans0/weebx-clang.git clang
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

      - name: Configure Kernel (whyred_defconfig)
        run: |
          mkdir -p out
          make O=out ARCH=arm64 whyred_defconfig

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="github"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Verify Output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "❌ Build failed: Image.gz-dtb not found!"
            exit 1
          fi

      - name: Upload Artifact (Image.gz-dtb)
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
