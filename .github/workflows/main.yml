name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_DIR: ${{ github.workspace }}/weebx-clang
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Clone Weebx Clang (weebx-clang)
      run: |
        git clone --depth=1 https://gitlab.com/XSans0/weebx-clang.git weebx-clang
        if [ -d "weebx-clang/bin" ]; then chmod -R +x weebx-clang/bin || true; fi
        echo "Toolchain location: $GITHUB_WORKSPACE/weebx-clang"
        ls -la weebx-clang || true

    - name: Verify toolchain and environment
      run: |
        export PATH=${{ github.workspace }}/weebx-clang/bin:$PATH
        echo "=== clang version ==="
        if command -v clang >/dev/null 2>&1; then clang --version | head -n 1; else echo "clang not found in PATH"; exit 1; fi
        echo "=== python version ==="
        python3 --version || true

    - name: Quick defconfig verify (make whyred_defconfig)
      working-directory: ${{ github.workspace }}
      run: |
        export PATH=${{ github.workspace }}/weebx-clang/bin:$PATH
        make ARCH=arm64 O=out whyred_defconfig
        if [ ! -f out/.config ]; then echo ".config not created"; ls -la out || true; exit 1; fi
        echo "Defconfig applied successfully (out/.config exists)."

    - name: Android kernel build (use downloaded clang)
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
        PATH: ${{ github.workspace }}/weebx-clang/bin:${{ env.PATH }}
        CC: ${{ github.workspace }}/weebx-clang/bin/clang
      with:
        arch: arm64
        compiler: local
        defconfig: whyred_defconfig
        image: Image.gz-dtb

    - name: Show build outputs (debug)
      if: always()
      run: |
        echo "Build step outputs:"
        echo "outfile: ${{ steps.build.outputs.outfile }}"
        ls -la out || true
        find . -maxdepth 3 -type f -name "*.ko" -o -name "Image*" -print || true

    - name: Upload Kernel and Modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel_build
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/*.ko
          ./out/Image*
